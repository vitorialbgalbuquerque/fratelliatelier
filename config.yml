backend:
  name: git-gateway
  branch: main

locale: pt
publish_mode: simple
media_folder: "img"
public_folder: "img"

collections:
  - name: catalogo
    label: Catálogo
    files:
      - name: dados
        label: Produtos, preços e fotos
        file: dados.json
        description: >-
          Mude o que quiser e clique em Publish, no alto da tela.
          O site se atualiza sozinho em cerca de um minuto.
        fields:
          - { name: versao, widget: hidden, default: 1 }

          - name: contato
            label: Contato
            widget: object
            collapsed: true
            fields:
              - { name: whatsapp, label: "WhatsApp (só números, começando com 55)", widget: string }
              - { name: telefone, label: "Telefone como aparece escrito", widget: string }
              - { name: instagram, label: "Instagram (sem @)", widget: string }

          - name: prazos
            label: Prazos de produção (em dias)
            widget: object
            collapsed: true
            fields:
              - { name: padrao, label: "Prazo normal", widget: number, value_type: int, min: 1 }
              - { name: havaianas, label: "Prazo quando tem Havaianas", widget: number, value_type: int, min: 1 }

          - name: eventos
            label: Tipos de evento (lista do carrinho)
            widget: list
            collapsed: true
            field: { name: evento, label: Evento, widget: string }

          - name: galeria
            label: "Festas que já passaram por aqui"
            widget: object
            collapsed: true
            fields:
              - { name: titulo, label: Título, widget: string }
              - { name: eyebrow, label: "Linha pequena acima do título", widget: string, required: false }
              - { name: lede, label: "Texto de abertura", widget: text, required: false }
              - name: fotos
                label: Fotos das festas
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.alt}}"
                fields:
                  - { name: src, label: Foto, widget: image }
                  - { name: alt, label: "Descrição da foto", widget: string, required: false }

          - name: secoes
            label: Seções do site
            label_singular: Seção
            widget: list
            collapsed: true
            summary: "{{fields.titulo}}"
            fields:
              - { name: titulo, label: Título da seção, widget: string }
              - { name: ativa, label: Aparece no site, widget: boolean, default: true, required: false }
              - { name: lede, label: "Texto de abertura", widget: text, required: false }

              - name: produtos
                label: Produtos
                label_singular: Produto
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.nome}}"
                fields:
                  - { name: nome, label: Nome do produto, widget: string }
                  - { name: ativo, label: Aparece no site, widget: boolean, default: true, required: false }
                  - name: tipo
                    label: Como é vendido
                    widget: select
                    default: unit
                    options:
                      - { label: "Preço único por unidade", value: unit }
                      - { label: "Tabela de quantidades", value: opt }
                      - { label: "A combinar (orçamento)", value: quote }
                  - { name: preco, label: "Preço (só para preço único)", widget: number, value_type: float, required: false }
                  - name: faixas
                    label: "Tabela de quantidades (só para tabela)"
                    label_singular: Faixa
                    widget: list
                    required: false
                    collapsed: true
                    summary: "{{fields.r}} — {{fields.p}}"
                    fields:
                      - { name: r, label: "Rótulo (ex.: 50 un)", widget: string }
                      - { name: p, label: Preço, widget: number, value_type: float }
                      - { name: a, label: "É 'a partir de'", widget: boolean, default: false, required: false }
                  - name: fotos
                    label: Fotos
                    widget: list
                    required: false
                    collapsed: true
                    summary: "{{fields.alt}}"
                    fields:
                      - { name: src, label: Foto, widget: image }
                      - { name: alt, label: "Descrição da foto", widget: string, required: false }
                  - { name: spec, label: "Ficha técnica (linha em destaque)", widget: string, required: false }
                  - { name: desc, label: Descrição, widget: text, required: false }
                  - name: notas
                    label: Observações
                    widget: list
                    required: false
                    collapsed: true
                    field: { name: nota, label: Observação, widget: text }

                  # --- guardados: continuam valendo, mas não aparecem na tela ---
                  - { name: sku, widget: hidden, default: "" }
                  - { name: un, widget: hidden, default: "un" }
                  - { name: conta, widget: hidden, default: false }
                  - { name: midia, widget: hidden, default: "" }
                  - { name: busca, widget: hidden, default: "" }
                  - { name: porUnidade, widget: hidden, default: "" }
                  - { name: adicional, widget: hidden, required: false }

              - name: havaianas
                label: "Havaianas — preço e cores (só na seção das Havaianas)"
                widget: object
                collapsed: true
                required: false
                fields:
                  - { name: preco, label: Preço por par, widget: number, value_type: float, required: false }
                  - { name: minimo, label: Mínimo de pares por numeração, widget: number, value_type: int, required: false }
                  - name: cores
                    label: Cores
                    widget: list
                    required: false
                    collapsed: true
                    summary: "{{fields.nome}}"
                    fields:
                      - { name: nome, label: Nome da cor, widget: string }
                      - { name: cor, label: "Cor da tira (código, ex.: #C089BE)", widget: string }
                      - { name: fundo, label: "Cor da sola (código)", widget: string }
                  - name: numeracoes
                    label: Numerações
                    widget: list
                    required: false
                    collapsed: true
                    field: { name: numero, label: Numeração, widget: string }
                  - name: fichas
                    label: Informações em destaque
                    widget: list
                    required: false
                    collapsed: true
                    summary: "{{fields.rotulo}}"
                    fields:
                      - { name: rotulo, label: Rótulo, widget: string }
                      - { name: texto, label: Texto, widget: string }
                  - { name: nome, widget: hidden, default: "Havaianas Color" }

              # --- guardados: continuam valendo, mas não aparecem na tela ---
              - { name: id, widget: hidden, default: "secao" }
              - { name: eyebrow, widget: hidden, default: "" }
              - { name: menu, widget: hidden, default: "" }
              - { name: chip, widget: hidden, default: "" }
              - { name: busca, widget: hidden, default: "" }
              - { name: alt, widget: hidden, default: false }
              - { name: grid, widget: hidden, default: "" }
              - { name: tipo, widget: hidden, default: "" }
              - { name: passos, widget: hidden, required: false }
